name: Java CI with Maven - Test and package
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # Accède au repo
        uses: actions/checkout@v4
      - name: Setup JDK 21 # Setup la version de JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Build with Maven # Crée le package avec Maven
        run: mvn -B package
